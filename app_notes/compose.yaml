name: msn-notes-dev

services:
  notes:
    environment:
      MSN_NOTES_ACCESS_URL: "${MSN_NOTES_ACCESS_URL:?Ange MSN_NOTES_ACCESS_URL}"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18001:8001"
    volumes:
      - notes_data:/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - notes

volumes:
  notes_data:
