# =========================================
# UPSTREAM (app01 backend)
# =========================================
upstream aina_backend {
    server 192.168.0.55:8000;
    keepalive 32;
}

# =========================================
# HTTP → HTTPS
# =========================================
server {
    listen 80;
    server_name my.supportnet.se;

    return 301 https://$host$request_uri;
}

# =========================================
# HTTPS (PROD)
# =========================================
server {
    listen 443 ssl http2;
    server_name my.supportnet.se;

    ssl_certificate     /etc/letsencrypt/live/my.supportnet.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.supportnet.se/privkey.pem;

    # -------------------------------------
    # SECURITY HEADERS
    # -------------------------------------
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -------------------------------------
    # BLOCKERA KÄNSLIGA FILER
    # -------------------------------------
    location ~ /\.(env|git|htaccess|htpasswd|ini|log|bak|sql)$ {
        deny all;
        return 404;
    }

    location ~* \.(py|pyc|pyo|db|sqlite3)$ {
        deny all;
        return 404;
    }

    location ~* (backup|\.bak|\.old|\.swp|\.tmp)$ {
        deny all;
        return 404;
    }

    location ~* /(core|venv|__pycache__|\.idea|\.vscode)/ {
        deny all;
        return 404;
    }

    location ~* (wp-admin|wp-login|phpmyadmin|adminer|shell|cmd) {
        return 404;
    }

    # -------------------------------------
    # MAIN TRAFFIC (ALLT VIA BACKEND)
    # -------------------------------------
    location / {
        proxy_pass http://aina_backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        proxy_connect_timeout 30;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # -------------------------------------
    # LOGGING
    # -------------------------------------
    access_log /var/log/nginx/aina_access.log;
    error_log  /var/log/nginx/aina_error.log warn;
}