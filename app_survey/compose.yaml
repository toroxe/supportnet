name: msn-survey-dev

services:
  survey:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MSN_SURVEY_ACCESS_URL: "${MSN_SURVEY_ACCESS_URL:?Ange MSN_SURVEY_ACCESS_URL}"
      SURVEY_DB_PATH: /data/survey.db
      SURVEY_LINK_KEY_FILE: /run/secrets/survey_link_key
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - survey_data:/data
    secrets:
      - survey_link_key

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:18090:80"
    depends_on:
      - survey

volumes:
  survey_data:

secrets:
  survey_link_key:
    file: "${SURVEY_LINK_KEY_HOST_PATH:-/home/toroxe/.config/supportnet/survey-link.key}"
