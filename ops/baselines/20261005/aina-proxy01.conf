# =========================================
# AINA PLATFORM - REVERSE PROXY
# =========================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream aina_backend {
    server 192.168.0.55:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name my.supportnet.se;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name my.supportnet.se;
    client_max_body_size 10M;

    ssl_certificate /etc/letsencrypt/live/my.supportnet.se/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.supportnet.se/privkey.pem;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location ~* (\.env|\.git|wp-admin|wp-login|xmlrpc|phpmyadmin) {
        return 444;
    }

    location ~* \.(py|pyc|pyo|db|sqlite3|log|bak|sql)$ {
        return 444;
    }

    location ~* /(core|venv|__pycache__|\.idea|\.vscode)/ {
        return 444;
    }

    # Notes frontend och API
    location = /apps/notes {
        return 301 /apps/notes/;
    }

    location /apps/notes/ {
        proxy_pass http://192.168.0.55:18080/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    # Övrig trafik till Core
    location / {
        proxy_pass http://aina_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60;
        proxy_send_timeout 60;
        proxy_read_timeout 60;
    }

    access_log /var/log/nginx/aina_access.log;
    error_log /var/log/nginx/aina_error.log warn;
}
