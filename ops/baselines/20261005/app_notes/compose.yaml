name: msn-notes-dev

services:
  notes:
    restart: unless-stopped
    environment:
      MSN_NOTES_ACCESS_URL: "${MSN_NOTES_ACCESS_URL:?Ange MSN_NOTES_ACCESS_URL}"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:18001:8001"
    volumes:
      - notes_data:/data

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "192.168.0.55:18080:80"
    depends_on:
      - notes

volumes:
  notes_data:
