<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222222">
    <title>Dashboard | MySupportNet</title>

    <link rel="manifest" href="/user/assets/pwa/manifest.json">

    <style>
        :root {
            --navy: #071a38;
            --gold: #ffcc00;
            --background: #eef3f8;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #d6dee8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: "Manrope", "Roboto", Arial, sans-serif;
        }

        .dashboard-header {
            background: #222222;
            color: #ffffff;
            border-bottom: 4px solid var(--gold);
        }

        .dashboard-header > .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .logo-container::after {
            content: "MySupportNet";
            font-size: 26px;
            font-weight: 700;
        }

        .logo-img {
            display: none;
        }

        #dashboardUser {
            margin: 0;
            color: var(--gold);
            font-size: 19px;
            font-weight: 600;
        }

        .dashboard-header > .container > div:last-child {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 12px 18px;
            border: 1px solid var(--navy);
            border-radius: 9px;
            background: #ffffff;
            color: var(--navy);
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #f8fafc;
        }

        .btn:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 3px;
        }

        main {
            width: calc(100% - 32px);
            max-width: 960px;
            margin: 24px auto;
        }

        .panel {
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: #ffffff;
        }

        h1 {
            margin: 0 0 8px;
            color: var(--navy);
            font-size: 28px;
        }

        .intro {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.5;
        }

        #userGreeting:empty {
            display: none;
        }

        #serviceContainer {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        #serviceContainer > .btn {
            justify-content: flex-start;
            min-height: 96px;
            width: 100%;
            padding: 22px;
            border-color: var(--border);
            border-left: 5px solid var(--gold);
            border-radius: 12px;
            color: var(--navy);
            font-size: 20px;
            text-align: left;
            overflow-wrap: anywhere;
        }

        #serviceContainer > .btn:hover {
            border-color: var(--navy);
            border-left-color: var(--gold);
            background: #eef3f8;
        }

        #serviceContainer > p {
            grid-column: 1 / -1;
            color: var(--muted);
        }

        .pwa-install-wrapper {
            margin-top: 20px;
            text-align: center;
        }

        #installPWA {
            background: var(--navy);
            color: #ffffff;
        }

        #installPWA:hover {
            background: #0b2855;
        }

        footer {
            padding: 8px 16px 24px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 600px) {
            .dashboard-header > .container {
                padding: 16px;
                gap: 12px;
            }

            .logo-container {
                width: 100%;
            }

            .logo-container::after {
                font-size: 24px;
            }

            #dashboardUser {
                font-size: 17px;
            }

            main {
                width: calc(100% - 16px);
                margin-top: 12px;
            }

            .panel {
                padding: 18px;
            }

            h1 {
                font-size: 25px;
            }

            #serviceContainer {
                grid-template-columns: 1fr;
            }

            #serviceContainer > .btn {
                min-height: 80px;
                padding: 18px;
                font-size: 19px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="panel" aria-labelledby="servicesHeading">
            <h1 id="servicesHeading">Mina tjänster</h1>
            <p class="intro">Välj tjänsten du vill arbeta med.</p>

            <p id="userGreeting"></p>

            <div id="serviceContainer" aria-live="polite">
                <p>Laddar dina tjänster...</p>
            </div>
        </section>

        <div class="pwa-install-wrapper">
            <button id="installPWA" class="btn" type="button"
                    style="display: none;">
                Installera som app
            </button>
        </div>
    </main>

    <footer>MySupportNet · Mina tjänster</footer>

    <script src="../js/userStandard.js" defer></script>
    <script src="../js/userDashboard.js" defer></script>
    <script src="../js/pwa.js" defer></script>
</body>
</html>
