<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blogg och partners | MySupportNet</title>
    <meta name="description" content="Läs MySupportNets tankar om AI, digitalisering och framtidens ledarskap och möt våra partners.">
    <link rel="canonical" href="https://my.supportnet.se/pages/blog.html">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="../assets/styles.css">
    <link rel="stylesheet" href="../assets/header.css">
    <link rel="stylesheet" href="../assets/footer.css">
    <link rel="stylesheet" href="../assets/blog.css">
</head>

<body>
    <div id="header-placeholder"></div>

    <section id="blog-hero" aria-labelledby="blog-heading">
        <div class="blog-hero__inner">
            <h1 id="blog-heading">Blogg och partners</h1>
            <p id="blog-introduction">Tankar, trender och teknik - följ våra insikter i AI-revolutionen.</p>
        </div>
    </section>

    <main id="blog-main">
        <div id="blog-status" class="page-status" role="status" aria-live="polite">
            Laddar innehåll...
        </div>

        <div id="blog-layout">
            <section id="blog-feed" aria-labelledby="blog-feed-heading">
                <div class="feed-heading-row">
                    <h2 id="blog-feed-heading">Senaste från bloggen</h2>
                </div>
                <div id="blog-posts" class="content-list" aria-live="polite"></div>
            </section>

            <aside id="partner-feed" aria-labelledby="partner-feed-heading">
                <div class="feed-heading-row">
                    <h2 id="partner-feed-heading">Våra partners</h2>
                </div>
                <div id="partner-posts" class="content-list" aria-live="polite"></div>
            </aside>
        </div>
    </main>

    <div
        id="cookie-consent"
        name="cookieModal"
        class="cookie-consent"
        role="dialog"
        aria-modal="true"
        aria-labelledby="cookie-consent-heading"
        aria-describedby="cookie-consent-description"
        hidden
    >
        <div class="cookie-consent-panel">
            <h2 id="cookie-consent-heading">Cookies</h2>
            <p id="cookie-consent-description">Vi använder cookies för att förbättra din upplevelse.</p>
            <button id="custom-cookie-btn" type="button">Acceptera</button>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/render.js"></script>
    <script type="module" src="/js/blog.js"></script>
    <script type="module" src="/js/cook.js"></script>
</body>
</html>
